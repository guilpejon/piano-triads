<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="pianoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3480f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5856D6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="16" cy="16" r="15" fill="url(#pianoGradient)" stroke="#fff" stroke-width="1"/>
  
  <!-- Piano keys -->
  <!-- White keys -->
  <rect x="6" y="10" width="2.5" height="12" fill="#fff" rx="0.5"/>
  <rect x="9" y="10" width="2.5" height="12" fill="#fff" rx="0.5"/>
  <rect x="12" y="10" width="2.5" height="12" fill="#fff" rx="0.5"/>
  <rect x="15" y="10" width="2.5" height="12" fill="#fff" rx="0.5"/>
  <rect x="18" y="10" width="2.5" height="12" fill="#fff" rx="0.5"/>
  <rect x="21" y="10" width="2.5" height="12" fill="#fff" rx="0.5"/>
  <rect x="24" y="10" width="2.5" height="12" fill="#fff" rx="0.5"/>
  
  <!-- Black keys -->
  <rect x="7.5" y="10" width="1.5" height="7" fill="#333" rx="0.3"/>
  <rect x="10.5" y="10" width="1.5" height="7" fill="#333" rx="0.3"/>
  <rect x="16.5" y="10" width="1.5" height="7" fill="#333" rx="0.3"/>
  <rect x="19.5" y="10" width="1.5" height="7" fill="#333" rx="0.3"/>
  <rect x="22.5" y="10" width="1.5" height="7" fill="#333" rx="0.3"/>
</svg>
