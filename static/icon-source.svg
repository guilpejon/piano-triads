<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Solid teal circular background -->
  <circle cx="256" cy="256" r="240" fill="#26a69a"/>
  
  <!-- Piano keys - properly aligned -->
  <g transform="translate(256, 256)">
    <!-- White keys - 7 keys total (C D E F G A B) -->
    <rect x="-105" y="-60" width="30" height="120" fill="#ffffff" rx="4"/>
    <rect x="-70" y="-60" width="30" height="120" fill="#ffffff" rx="4"/>
    <rect x="-35" y="-60" width="30" height="120" fill="#ffffff" rx="4"/>
    <rect x="0" y="-60" width="30" height="120" fill="#ffffff" rx="4"/>
    <rect x="35" y="-60" width="30" height="120" fill="#ffffff" rx="4"/>
    <rect x="70" y="-60" width="30" height="120" fill="#ffffff" rx="4"/>
    <rect x="105" y="-60" width="30" height="120" fill="#ffffff" rx="4"/>
    
    <!-- Black keys - properly positioned between white keys -->
    <rect x="-82.5" y="-60" width="20" height="75" fill="#1a1a1a" rx="3"/>
    <rect x="-47.5" y="-60" width="20" height="75" fill="#1a1a1a" rx="3"/>
    <rect x="22.5" y="-60" width="20" height="75" fill="#1a1a1a" rx="3"/>
    <rect x="57.5" y="-60" width="20" height="75" fill="#1a1a1a" rx="3"/>
    <rect x="92.5" y="-60" width="20" height="75" fill="#1a1a1a" rx="3"/>
  </g>
</svg>
